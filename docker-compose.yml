services:
  postgres:
    image: postgres:17-alpine
    container_name: greencode-av2-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: greencode
      POSTGRES_PASSWORD: greencode
      POSTGRES_DB: greencode
    ports:
      - "5433:5432"
    volumes:
      - greencode_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U greencode -d greencode"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  greencode_data:
